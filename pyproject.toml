[project]
name = "noise-radar"
version = "0.1.0"
description = "Detects coordinated amplification on Bluesky and reports its own error rates."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "websockets>=13",
    "numpy>=2.0",
    "datasketch>=1.6",
    "google-genai>=1.0",
    "openai>=1.40",
    "python-igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "scipy>=1.18.1",
    "pillow>=13.0.0",
    "imagehash>=4.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ingest", "signals", "media", "sources", "lookup", "analyst", "eval", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
