# Production stack for the Hostinger VPS. From the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: noise-radar

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

  # Add ingest / signals workers here as they land, reusing the same image:
  # ingest:
  #   build: { context: .., dockerfile: Dockerfile }
  #   command: ["python", "-m", "ingest"]
  #   env_file: ../.env
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/public:/srv/web:ro
      - caddy_data:/data
    depends_on: [api]

  # Source checks (Oxylabs Web API) and analyst verdicts (Gemini) for scored clusters.
  sources:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "sources", "worker"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on: { db: { condition: service_healthy } }

  analyst:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "analyst", "worker"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  caddy_data:
