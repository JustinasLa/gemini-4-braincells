<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="Noise Radar detects coordinated amplification on Bluesky, shows the evidence behind every call and publishes its own error rates.">
  <title>Noise Radar</title>
  <link rel="icon" href="trackdown/coin/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* One visual language with Trackdown (web/trackdown/src/styles.css): same type, same verdict colours. */
    :root {
      --black: #050506; --surface: #0e0e11; --surface-2: #151519; --hover: #1a1a1f;
      --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
      --text: #f2efe9; --text-2: #b4b0a8; --text-3: #8f8b84;
      --cv: #3fe07a; --shill: #e2533c; --chill: #5fc9a8; --unsure: #9aa6bf; --source: #7aa2f0; --gold: #e4b36a;
      --wide: "Michroma", "Eurostile", ui-sans-serif, sans-serif;
      --sans: "Inter Tight", "Inter", ui-sans-serif, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 76px; }
    body { margin: 0; background: var(--black); color: var(--text); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--cv); outline-offset: 2px; border-radius: 4px; }
    ::selection { background: rgba(63,224,122,.3); }
    h1, h2, h3, p { margin: 0; }
    ul { margin: 0; padding-left: 18px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .mono { font-family: var(--mono); }
    .label { font: 500 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
    .muted { color: var(--text-3); }
    .num { font-variant-numeric: tabular-nums; }

    /* top bar */
    .topbar { position: sticky; top: 0; z-index: 10; height: 60px; display: flex; align-items: center; gap: 28px; padding: 0 24px; background: rgba(5,5,6,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .wordmark { font: 13px/1 var(--wide); letter-spacing: .28em; text-decoration: none; white-space: nowrap; }
    .nav { display: flex; gap: 4px; }
    .nav a { padding: 8px 12px; border-radius: 8px; color: var(--text-2); text-decoration: none; font-weight: 500; }
    .nav a:hover { color: var(--text); background: var(--surface-2); }
    .nav a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .live { display: flex; align-items: center; gap: 8px; font: 12px/1 var(--mono); color: var(--text-3); white-space: nowrap; }
    .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
    .live.ok .dot { background: var(--cv); box-shadow: 0 0 0 3px rgba(63,224,122,.18); }
    .live.down .dot { background: var(--shill); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
    .btn:hover { background: var(--surface-2); border-color: rgba(255,255,255,.3); }
    .btn.primary { background: var(--text); color: var(--black); border-color: var(--text); }
    .btn.primary:hover { background: #fff; }

    main:focus { outline: none; }
    .page { max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; margin-bottom: 32px; }
    .page-head h1 { font-size: clamp(26px, 3.2vw, 36px); line-height: 1.1; letter-spacing: -.02em; font-weight: 600; max-width: 640px; }
    .page-head p { color: var(--text-2); margin-top: 12px; max-width: 620px; }

    /* trace form */
    .trace { width: 400px; flex: none; }
    .trace form { display: flex; gap: 8px; }
    .trace input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); }
    .trace input::placeholder { color: var(--text-3); }
    .trace input:focus { outline: none; border-color: var(--cv); box-shadow: 0 0 0 3px rgba(63,224,122,.15); }
    .trace .btn { height: 40px; }
    .trace p { margin-top: 8px; font-size: 13px; color: var(--text-3); }

    /* status pills */
    .pill { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.lg { height: 30px; padding: 0 13px; font-size: 15px; }
    .s-coordinated { --c: var(--shill); } .s-likely_organic { --c: var(--chill); } .s-insufficient { --c: var(--unsure); }

    /* status tabs */
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text-2); text-align: left; }
    .tab:hover { border-color: var(--line-2); color: var(--text); }
    .tab[aria-pressed="true"] { border-color: var(--c, var(--text)); color: var(--text); background: color-mix(in srgb, var(--c, #fff) 8%, var(--surface)); }
    .tab b { font-size: 20px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .tab-all { --c: var(--text-2); }
    .tab-note { color: var(--text-3); font-size: 14px; margin-bottom: 20px; min-height: 21px; }

    /* cluster list */
    .list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .list-head, .row { display: grid; grid-template-columns: 128px minmax(0,1fr) 84px 112px 150px 96px; gap: 16px; align-items: center; padding: 0 18px; }
    .list-head { height: 40px; border-bottom: 1px solid var(--line); }
    .list-head .r, .row .r { text-align: right; justify-content: flex-end; }
    .row { min-height: 68px; padding-top: 12px; padding-bottom: 12px; text-decoration: none; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--hover); }
    .row:hover .headline { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
    .headline { font-weight: 500; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .sub { font-size: 13px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { display: flex; align-items: center; gap: 10px; }
    .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--c, var(--text-2)); }
    .opinion { font-size: 13px; color: var(--text-2); }
    .opinion.diff { color: var(--text); }
    .opinion .pill { height: 22px; font-size: 12px; padding: 0 8px; }
    .when { font-size: 13px; color: var(--text-3); }
    .tag { display: inline-block; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--text-2); vertical-align: 2px; margin-left: 6px; }
    .more { display: flex; justify-content: center; padding: 16px; border-top: 1px solid var(--line); }
    .list-foot { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--text-3); }
    .linkish { background: none; border: 0; padding: 0; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; }
    .linkish:hover { color: var(--text); }
    .state { padding: 48px 24px; text-align: center; color: var(--text-2); }
    .state h2 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .state .btn { margin-top: 16px; }

    /* cluster detail */
    .back { display: inline-flex; gap: 6px; color: var(--text-2); text-decoration: none; font-size: 14px; margin-bottom: 20px; }
    .back:hover { color: var(--text); }
    .detail-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .detail-head h1 { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; letter-spacing: -.015em; font-weight: 600; max-width: 900px; }
    .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--text-2); }
    .facts span + span::before { content: ""; }
    .detail { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 20px; align-items: start; }
    .col { display: grid; gap: 20px; min-width: 0; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; min-width: 0; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .card-head h2 { font-size: 16px; font-weight: 600; }
    .card-head .label { white-space: nowrap; }
    .card > p + p { margin-top: 10px; }
    .lede { color: var(--text-2); }

    .call { display: grid; gap: 18px; }
    .call-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 16px; }
    .metrics4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .metric { background: var(--surface); padding: 14px; }
    .metric b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .metric small { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; }
    .rules { display: grid; gap: 8px; }
    .rule { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; color: var(--text-3); }
    .rule .mono { font-size: 12.5px; }
    .rule.met { border-color: color-mix(in srgb, var(--c) 45%, transparent); color: var(--text-2); background: color-mix(in srgb, var(--c) 6%, transparent); }
    .rule strong { color: var(--c); font-weight: 600; }

    .sig { padding: 14px 0; border-top: 1px solid var(--line); }
    .sig:first-of-type { border-top: 0; padding-top: 0; }
    .sig-top { display: grid; grid-template-columns: minmax(0,1fr) 120px; gap: 16px; align-items: baseline; }
    .sig-name { font-weight: 600; }
    .sig-name .label { margin-left: 8px; }
    .sig p { color: var(--text-2); font-size: 14px; margin-top: 2px; }
    .sig .score { font-size: 13px; }
    .sig.off { opacity: .62; }
    details.receipts { margin-top: 8px; }
    details.receipts summary, details.fold summary { cursor: pointer; font-size: 13px; color: var(--text-3); width: fit-content; }
    details.receipts summary:hover, details.fold summary:hover { color: var(--text); }
    .receipt-body { margin-top: 8px; padding: 10px 12px; border-left: 2px solid var(--line-2); font-size: 13px; color: var(--text-2); display: grid; gap: 6px; }
    .links { display: flex; flex-wrap: wrap; gap: 6px; }
    .links a, .chip { font: 12px/1 var(--mono); padding: 6px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); text-decoration: none; color: var(--text-2); }
    .links a:hover { color: var(--text); border-color: var(--line-2); }
    .group-label { margin: 22px 0 10px; }
    .group-label:first-child { margin-top: 0; }

    .chart { width: 100%; height: auto; display: block; }
    .chart text { font: 11px var(--mono); fill: var(--text-3); }
    .chart-caption { font-size: 14px; color: var(--text-2); margin-top: 10px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-3); margin-top: 8px; }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

    .opinion-card .call-line { font-size: 15px; }
    .notice { font-size: 13px; color: var(--text-2); padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
    .notice strong { color: var(--text); }
    .reasons { display: grid; gap: 16px; margin-top: 16px; }
    .reasons h3 { margin-bottom: 6px; }
    .reasons li { margin: 4px 0; color: var(--text-2); font-size: 14px; }
    .reasons li a { color: var(--text-3); font-size: 12px; text-decoration: none; font-family: var(--mono); }
    .reasons li a:hover { color: var(--text); }
    .foot-meta { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); font-family: var(--mono); display: flex; flex-wrap: wrap; gap: 4px 14px; }

    .item { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
    .item:first-of-type { border-top: 0; padding-top: 0; }
    .item p { font-size: 14px; color: var(--text-2); }
    .item a.out { font-size: 13px; color: var(--text-2); text-underline-offset: 3px; word-break: break-all; }
    .item a.out:hover { color: var(--text); }
    .thumb { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
    .hits { display: grid; gap: 4px; font-size: 13px; }
    .hits a { color: var(--text-2); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hits a:hover { color: var(--text); text-decoration: underline; }
    .hits span { color: var(--text-3); font-family: var(--mono); font-size: 11px; margin-right: 6px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font: 500 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 0 8px 10px 0; }
    td { padding: 9px 8px 9px 0; border-top: 1px solid var(--line); color: var(--text-2); }
    td a { color: var(--text); text-decoration: none; }
    td a:hover { text-decoration: underline; }
    th.r, td.r { text-align: right; padding-right: 0; }
    .handle { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .post { padding: 14px 0; border-top: 1px solid var(--line); }
    .post:first-of-type { border-top: 0; padding-top: 0; }
    .post-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--text-3); }
    .post-meta a { color: var(--text-2); text-decoration: none; }
    .post-meta a:hover { color: var(--text); text-decoration: underline; }
    .post p { margin-top: 4px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

    /* accuracy */
    .acc-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
    .acc .q { font-size: 18px; font-weight: 600; line-height: 1.3; }
    .acc .what { color: var(--text-2); font-size: 14px; margin-top: 6px; }
    .big { display: flex; align-items: baseline; gap: 12px; margin: 20px 0 4px; flex-wrap: wrap; }
    .big b { font-size: 44px; line-height: 1; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .big span { color: var(--text-2); }
    .ci { font-size: 14px; color: var(--text-3); }
    .ci-track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); margin: 14px 0 4px; }
    .ci-track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: color-mix(in srgb, var(--c) 45%, transparent); min-width: 3px; }
    .ci-track em { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--c); }
    .ci-scale { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--text-3); }
    .levels { display: grid; gap: 10px; margin-top: 18px; }
    .level { display: grid; grid-template-columns: 34px minmax(0,1fr) 120px; gap: 12px; align-items: center; font-size: 14px; }
    .level small { display: block; color: var(--text-3); font-size: 12px; }
    .acc .foot-meta { margin-top: 20px; }
    .neutral { --c: var(--text-2); }
    .split { font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; color: var(--cv); background: rgba(63,224,122,.12); white-space: nowrap; }
    .split.dev { color: var(--text-2); background: var(--surface-2); }
    .acc-intro { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; margin-bottom: 28px; }
    .acc-intro div { border-top: 1px solid var(--line-2); padding-top: 12px; font-size: 14px; color: var(--text-2); }
    .acc-intro strong { display: block; color: var(--text); margin-bottom: 2px; }

    /* method */
    .prose { max-width: 760px; }
    .prose h2 { font-size: 20px; font-weight: 600; margin: 40px 0 12px; }
    .prose p, .prose li { color: var(--text-2); }
    .prose li { margin: 6px 0; }
    .steps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-top: 8px; }
    .step { border-top: 2px solid var(--line-2); padding-top: 14px; }
    .step .label { color: var(--cv); }
    .step h3 { font-size: 16px; font-weight: 600; margin: 8px 0 6px; }
    .step p { font-size: 14px; color: var(--text-2); }
    .outcomes { display: grid; gap: 10px; }
    .outcome { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .outcome p { color: var(--text-2); font-size: 14px; }

    footer { max-width: 1200px; margin: 0 auto; padding: 24px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-3); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

    @media (max-width: 1000px) {
      .detail { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; align-items: stretch; }
      .trace { width: 100%; }
      .acc-grid, .acc-intro { grid-template-columns: 1fr; }
      .steps { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .list-head, .row { grid-template-columns: 120px minmax(0,1fr) 72px 100px 96px; }
      .list-head .c-op, .row .c-op { display: none; }
    }
    @media (max-width: 720px) {
      /* backdrop-filter would make the topbar the containing block of the fixed bottom nav */
      .topbar { gap: 12px; padding: 0 16px; backdrop-filter: none; background: var(--black); }
      .wordmark { font-size: 11px; letter-spacing: .22em; }
      .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; justify-content: space-around; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: rgba(5,5,6,.95); border-top: 1px solid var(--line); backdrop-filter: blur(10px); }
      .nav a { flex: 1; text-align: center; }
      .live .txt { display: none; }
      .page { padding: 24px 16px 96px; }
      footer { padding: 20px 16px 96px; }
      .list-head { display: none; }
      .row { grid-template-columns: 1fr auto; grid-template-areas: "st when" "main main" "meta meta"; gap: 8px; padding: 14px 16px; }
      .row .c-st { grid-area: st; } .row .c-when { grid-area: when; } .row .c-main { grid-area: main; }
      .row .c-acc, .row .c-score, .row .c-op { display: none; }
      .row .c-meta { grid-area: meta; display: flex !important; gap: 14px; font-size: 13px; color: var(--text-3); }
      .tab { flex: 1 1 calc(50% - 8px); }
      .metrics4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .rule { grid-template-columns: 1fr; gap: 4px; }
      .steps { grid-template-columns: 1fr; }
      .outcome { grid-template-columns: 1fr; gap: 8px; }
      .card { padding: 18px; }
      .level { grid-template-columns: 30px minmax(0,1fr) 92px; }
    }
    .row .c-meta { display: none; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#/" aria-label="Noise Radar: live monitor">NOISE RADAR</a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="monitor">Monitor</a>
      <a href="#/accuracy" data-nav="accuracy">Accuracy</a>
      <a href="#/method" data-nav="method">Method</a>
    </nav>
    <div class="top-right">
      <div class="live" id="live" role="status"><span class="dot"></span><span class="txt">Connecting…</span></div>
      <a class="btn" href="trackdown/">Trace a link</a>
    </div>
  </header>
  <main id="app" class="page" tabindex="-1"></main>
  <footer>
    <span>A cluster is a behavioural signal, not a claim about a person or a viewpoint.</span>
    <span>Read-only analysis of public Bluesky posts.</span>
  </footer>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const PAGE = 30;
  const state = { clusters: [], metrics: [], health: null, loaded: false, error: null, metricsError: null, filter: 'coordinated', shown: PAGE, details: new Map(), loadedAt: null };

  // ---------- formatting
  const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
  const num = (v) => (v == null || Number.isNaN(Number(v)) ? null : Number(v));
  const fix2 = (v) => (num(v) == null ? '–' : num(v).toFixed(2));
  const pct = (v, d = 0) => (num(v) == null ? '–' : `${(num(v) * 100).toFixed(d)}%`);
  const pval = (v) => (num(v) == null ? '–' : num(v) < 0.001 ? '< 0.001' : String(Math.round(num(v) * 1000) / 1000));
  const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
  const dtf = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const tf = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });
  const when = (v) => (v ? dtf.format(new Date(v)) : '–');
  const ago = (v) => {
    if (!v) return '–';
    const s = Math.max(0, (Date.now() - new Date(v).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    return `${Math.floor(s / 86400)} d ago`;
  };
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
  const ext = (href, text, cls = '') => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noreferrer noopener">${text}</a>`;

  const STATUS = {
    coordinated: { word: 'Coordinated', note: 'Accounts that acted together in a way chance and organic crowds don’t explain.' },
    insufficient: { word: 'Can’t tell', note: 'Something looked unusual, but not enough to make a call. The detector abstains instead of guessing.' },
    likely_organic: { word: 'Likely organic', note: 'Activity that looks like a real crowd: established accounts or a wider conversation.' },
  };
  const pill = (s, cls = '') => `<span class="pill s-${esc(s)} ${cls}">${esc((STATUS[s] || { word: s || 'Unknown' }).word)}</span>`;

  const FAMILY = { content: 'Content', timing: 'Timing', network: 'Network', identity: 'Identity', guard: 'Organic guard' };
  const SIGNAL = {
    shared_link: 'Same link', duplicate_text: 'Identical text', near_duplicate_text: 'Near-identical text',
    semantic_duplicate: 'Same message, reworded', duplicate_media: 'Same image', burst_synchrony: 'Posting in bursts',
    clockwork_posting: 'Clockwork timing', repeated_co_engagement: 'Repeated co-engagement', mutual_amplification: 'Boosting each other',
    templated_handles: 'Templated handles', fresh_accounts: 'New accounts', empty_profiles: 'Empty profiles',
    established_accounts: 'Established accounts', part_of_wider_crowd: 'Part of a wider crowd', clock_aligned_posting: 'Scheduled on the hour',
    members_converse: 'Accounts talk to each other', declared_automation: 'Declared bot',
  };
  const sigName = (n) => SIGNAL[n] || String(n || 'Signal').replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());
  const WINDOW = { '10m': '10-minute window', '1h': '1-hour window' };

  // ---------- data
  const api = async (path) => {
    const r = await fetch(path, { headers: { accept: 'application/json' } });
    const body = await r.json().catch(() => null);
    if (!r.ok) throw new Error((body && body.detail) || `The server answered ${r.status}`);
    return body;
  };
  async function load() {
    const [health, clusters, metrics] = await Promise.allSettled([api('/api/health'), api('/api/clusters?limit=200'), api('/api/metrics')]);
    state.health = health.status === 'fulfilled' ? health.value : { ok: false };
    if (clusters.status === 'fulfilled') { state.clusters = Array.isArray(clusters.value) ? clusters.value : []; state.error = null; }
    else state.error = clusters.reason.message;
    if (metrics.status === 'fulfilled') { state.metrics = Array.isArray(metrics.value) ? metrics.value : []; state.metricsError = null; }
    else state.metricsError = metrics.reason.message;
    state.loaded = true; state.loadedAt = new Date();
    renderLive();
  }
  function renderLive() {
    const el = document.getElementById('live');
    const h = state.health;
    const ok = h && h.ok;
    el.className = `live ${ok ? 'ok' : 'down'}`;
    el.querySelector('.txt').textContent = ok ? `Live · last post ${ago(h.last_event_at)}` : 'Monitor offline';
    el.title = ok && h.last_event_at ? `Last post ingested ${when(h.last_event_at)}` : '';
  }

  // the most telling signal: the strongest one that points toward coordination
  const headline = (c) => {
    const sigs = (c.top_signals || []).filter((s) => s.summary);
    const best = sigs.find((s) => s.polarity !== 'against' && num(s.score) > 0) || sigs[0];
    // the parenthetical is method detail (thresholds, model); the Evidence card keeps the full text
    return best ? best.summary.replace(/\s*\([^)]*\)\s*$/, '').replace(/^./, (x) => x.toUpperCase()) : `${plural(c.size || 0, 'account')} grouped together`;
  };
  const firedNames = (c) => (c.top_signals || []).filter((s) => s.polarity !== 'against' && num(s.score) > 0).map((s) => sigName(s.name).toLowerCase());

  // ---------- router
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const [page, arg] = h.split('/');
    document.querySelectorAll('[data-nav]').forEach((a) => {
      const on = (page || 'monitor') === a.dataset.nav || (page === 'cluster' && a.dataset.nav === 'monitor');
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (page === 'cluster' && arg) return showCluster(Number(arg));
    if (page === 'accuracy') { document.title = 'Accuracy · Noise Radar'; return renderAccuracy(); }
    if (page === 'method') { document.title = 'Method · Noise Radar'; return renderMethod(); }
    document.title = 'Noise Radar';
    return renderMonitor();
  }
  const go = (fn) => { fn(); window.scrollTo(0, 0); };
  window.addEventListener('hashchange', () => { go(route); app.focus({ preventScroll: true }); });

  // ---------- monitor
  function renderMonitor() {
    const counts = { coordinated: 0, insufficient: 0, likely_organic: 0 };
    state.clusters.forEach((c) => { if (c.status in counts) counts[c.status] += 1; });
    const items = state.clusters.filter((c) => state.filter === 'all' || c.status === state.filter);
    const tab = (key, word) => `<button class="tab ${key === 'all' ? 'tab-all' : `s-${key}`}" data-filter="${key}" aria-pressed="${state.filter === key}"><b>${key === 'all' ? state.clusters.length : counts[key]}</b>${word}</button>`;
    const note = state.filter === 'all' ? 'Every call the detector made, newest first.' : STATUS[state.filter].note;
    let body;
    if (!state.loaded) body = `<div class="list"><div class="state">Loading the live feed…</div></div>`;
    else if (state.error && !state.clusters.length) body = `<div class="list"><div class="state" role="alert"><h2>The live feed is unavailable</h2><p>${esc(state.error)}</p><button class="btn" data-retry>Try again</button></div></div>`;
    else if (!items.length) body = `<div class="list"><div class="state"><h2>No ${state.filter === 'all' ? '' : esc(STATUS[state.filter].word.toLowerCase()) + ' '}clusters right now</h2><p>The newest ${state.clusters.length} clusters have none. New windows are scored every few minutes.</p></div></div>`;
    else body = `<div class="list" role="list">
        <div class="list-head" aria-hidden="true"><span class="label">Call</span><span class="label">What the accounts did</span><span class="label r">Accounts</span><span class="label">Score</span><span class="label c-op">Gemini</span><span class="label r">Last active</span></div>
        ${items.slice(0, state.shown).map(row).join('')}
        ${items.length > state.shown ? `<div class="more"><button class="btn" data-more>Show ${Math.min(PAGE, items.length - state.shown)} more</button></div>` : ''}
      </div>
      <div class="list-foot"><span>${items.length > state.shown ? `Showing ${state.shown} of ${items.length}` : plural(items.length, 'cluster')} · from the newest ${state.clusters.length} clusters</span><span>Updated ${state.loadedAt ? tf.format(state.loadedAt) : '–'} · refreshes every 30 s</span></div>`;

    app.innerHTML = `
      <section class="page-head">
        <div>
          <h1>Coordinated amplification on Bluesky, caught live.</h1>
          <p>Noise Radar groups accounts that act together, tests their timing against chance and says “can’t tell” when the evidence is thin. Every call opens to its receipts.</p>
        </div>
        <div class="trace">
          <form id="trace" role="search" aria-label="Trace a post or link">
            <label class="sr-only" for="trace-input">Post, link or @handle</label>
            <input id="trace-input" name="q" placeholder="Paste a post, a link or an @handle" autocomplete="off" maxlength="2000">
            <button class="btn primary" type="submit">Trace it</button>
          </form>
          <p>Opens Trackdown: where it came from, how it spread, and whether the spread was coordinated.</p>
        </div>
      </section>
      <div class="tabs" role="group" aria-label="Filter by the detector’s call">
        ${tab('coordinated', 'Coordinated')}${tab('insufficient', 'Can’t tell')}${tab('likely_organic', 'Likely organic')}${tab('all', 'All')}
      </div>
      <p class="tab-note">${esc(note)}</p>
      ${body}`;
    app.querySelectorAll('[data-filter]').forEach((b) => (b.onclick = () => { state.filter = b.dataset.filter; state.shown = PAGE; renderMonitor(); app.querySelector(`[data-filter="${state.filter}"]`).focus(); }));
    const more = app.querySelector('[data-more]');
    if (more) more.onclick = () => { const at = state.shown; state.shown += PAGE; renderMonitor(); const next = app.querySelectorAll('.row')[at]; if (next) next.focus(); };
    const retry = app.querySelector('[data-retry]');
    if (retry) retry.onclick = () => load().then(renderMonitor);
    app.querySelector('#trace').onsubmit = (e) => {
      e.preventDefault();
      const q = e.target.q.value.trim();
      location.href = q ? `trackdown/?lookup=${encodeURIComponent(q)}` : 'trackdown/';
    };
  }

  function opinionCell(c) {
    const v = c.verdict;
    if (!v) return '<span class="opinion muted">Not reviewed</span>';
    const call = v.llm_assessment || v.status;
    if (call === c.status) return '<span class="opinion">Agrees</span>';
    return `<span class="opinion diff" title="Gemini reads this cluster differently from the detector">${pill(call)}</span>`;
  }
  function row(c) {
    const size = c.size == null ? '–' : c.size;
    const fired = firedNames(c);
    const sub = [`#${Number(c.id)}`, WINDOW[c.window_kind] || c.window_kind, fired.length ? fired.slice(0, 3).join(', ') : null].filter(Boolean).join(' · ');
    const label = `${(STATUS[c.status] || {}).word || c.status}: ${headline(c)}. ${size} accounts, score ${fix2(c.score)}`;
    return `<a class="row" role="listitem" href="#/cluster/${Number(c.id)}" aria-label="${esc(label)}">
      <span class="c-st">${pill(c.status)}</span>
      <span class="c-main"><span class="headline">${esc(headline(c))}</span>${c.synthetic ? '<span class="tag">Test data</span>' : ''}<span class="sub">${esc(sub)}</span></span>
      <span class="c-acc r num">${size}</span>
      <span class="c-score score s-${esc(c.status)}"><span class="num">${fix2(c.score)}</span><span class="bar"><i style="width:${Math.max(0, Math.min(1, num(c.score) || 0)) * 100}%"></i></span></span>
      <span class="c-op">${opinionCell(c)}</span>
      <span class="c-when r when" title="${esc(when(c.window_end))}">${ago(c.window_end)}</span>
      <span class="c-meta"><span>${size} accounts</span><span>score ${fix2(c.score)}</span><span>${c.verdict ? `Gemini: ${(c.verdict.llm_assessment || c.verdict.status) === c.status ? 'agrees' : (STATUS[c.verdict.llm_assessment] || {}).word || 'differs'}` : ''}</span></span>
    </a>`;
  }

  // ---------- cluster detail
  async function showCluster(id) {
    document.title = `Cluster #${id} · Noise Radar`;
    const cached = state.details.get(id);
    if (cached) return renderCluster(cached);
    app.innerHTML = `<a class="back" href="#/">← All clusters</a><div class="card state">Loading cluster #${id}…</div>`;
    try {
      const c = await api(`/api/clusters/${encodeURIComponent(id)}`);
      state.details.set(id, c);
      if (location.hash === `#/cluster/${id}`) renderCluster(c);
    } catch (e) {
      if (location.hash === `#/cluster/${id}`) app.innerHTML = `<a class="back" href="#/">← All clusters</a><div class="card state" role="alert"><h2>Couldn’t open cluster #${id}</h2><p>${esc(e.message)}</p><button class="btn" data-retry>Try again</button></div>`;
      const r = app.querySelector('[data-retry]'); if (r) r.onclick = () => showCluster(id);
    }
  }

  function renderCluster(c) {
    const sig = c.signals || {};
    const evidence = c.evidence || [];
    const byId = new Map(evidence.map((e) => [e.id, e]));
    const handles = new Map((c.members || []).map((m) => [m.did, m.handle || m.did]));
    const span = c.window_start && c.window_end ? `${when(c.window_start)} – ${tf.format(new Date(c.window_end))}` : '';
    app.innerHTML = `
      <a class="back" href="#/">← All clusters</a>
      <section class="detail-head">
        <div>${pill(c.status, 'lg')}${c.synthetic ? '<span class="tag">Test data</span>' : ''}</div>
        <h1>${esc(headline(c))}</h1>
        <div class="facts num"><span>Cluster #${Number(c.id)}</span><span>${plural(c.size || 0, 'account')}</span><span>Active ${esc(span)}</span><span>scored in ${esc(WINDOW[c.window_kind] || c.window_kind || '')}s</span>${sig.detector_version ? `<span>detector ${esc(sig.detector_version)}</span>` : ''}</div>
      </section>
      <div class="detail">
        <div class="col">
          ${callCard(c)}
          ${signalsCard(c, byId)}
          ${timingCard(c, handles)}
          ${postsCard(c, handles)}
        </div>
        <div class="col">
          ${opinionCard(c, byId)}
          ${mediaCard(c, evidence)}
          ${sourcesCard(evidence)}
          ${accountsCard(c)}
        </div>
      </div>`;
    app.querySelectorAll('[data-showall]').forEach((b) => (b.onclick = () => { b.closest('[data-fold]').querySelectorAll('[hidden]').forEach((x) => x.removeAttribute('hidden')); b.remove(); }));
  }

  function callCard(c) {
    const sig = c.signals || {};
    const rules = sig.status_rule || {};
    const fired = Array.isArray(sig.families_fired) ? sig.families_fired : [];
    const famCount = Object.keys(sig.family_scores || {}).length || 4;
    const guard = sig.organic_guard_score;
    const ruleRow = (key) => rules[key] ? `<div class="rule s-${key} ${c.status === key ? 'met' : ''}"><span>${c.status === key ? '<strong>Met</strong> · ' : ''}${esc(STATUS[key].word)}</span><span class="mono">${esc(rules[key])}</span></div>` : '';
    const hasRules = rules.coordinated || rules.likely_organic;
    return `<section class="card call" aria-labelledby="h-call">
      <div class="card-head" style="margin-bottom:0"><h2 id="h-call">The detector’s call</h2><span class="label">rule-based, no AI</span></div>
      <p class="call-line">${pill(c.status)}<span class="lede">${esc(STATUS[c.status] ? STATUS[c.status].note : '')}</span></p>
      <div class="metrics4">
        <div class="metric"><span class="label">Score</span><b>${fix2(c.score)}</b><small>0 to 1, not a probability</small></div>
        <div class="metric"><span class="label">Timing p-value</span><b>${pval(c.p_value ?? sig.p_value)}</b><small>vs. shuffled timing</small></div>
        <div class="metric"><span class="label">Families fired</span><b>${fired.length} of ${famCount}</b><small>${fired.length ? esc(fired.join(', ')) : 'none'}</small></div>
        <div class="metric"><span class="label">Organic guard</span><b>${fix2(guard)}</b><small>high = looks like a real crowd</small></div>
      </div>
      ${hasRules ? `<div class="rules">${ruleRow('coordinated')}${ruleRow('likely_organic')}${c.status === 'insufficient' ? `<div class="rule s-insufficient met"><span><strong>Met</strong> · Can’t tell</span><span>Neither rule above holds, so the detector abstains.</span></div>` : ''}</div>` : ''}
    </section>`;
  }

  function receipt(e) {
    if (!e) return '';
    const d = e.detail || {};
    const posts = (d.post_urls || []).slice(0, 8);
    const profiles = (d.profile_urls || []).slice(0, 8);
    const facts = [];
    if (d.test) facts.push(`Test: ${esc(d.test)}${d.p_value != null ? ` · p = ${pval(d.p_value)}` : ''}`);
    if (d.key && d.key_kind === 'url') facts.push(`Link: ${ext(d.key, esc(d.key), 'out')}`);
    return `<details class="receipts"><summary>Receipts${posts.length ? ` · ${plural((d.post_urls || []).length, 'post')}` : ''}${profiles.length ? ` · ${plural((d.profile_urls || []).length, 'profile')}` : ''}</summary><div class="receipt-body">
      ${facts.map((f) => `<div>${f}</div>`).join('')}
      ${posts.length ? `<div class="links">${posts.map((u, i) => ext(u, `post ${i + 1} ↗`)).join('')}</div>` : ''}
      ${profiles.length ? `<div class="links">${profiles.map((u, i) => ext(u, `profile ${i + 1} ↗`)).join('')}</div>` : ''}
      <div class="muted mono" style="font-size:11px">evidence #${Number(e.id)} · ${esc(e.model || 'detector')}</div>
    </div></details>`;
  }
  function signalsCard(c, byId) {
    const all = ((c.signals || {}).signals || c.top_signals || []).slice();
    if (!all.length) return '';
    const forCo = all.filter((s) => s.polarity !== 'against').sort((a, b) => (num(b.score) || 0) - (num(a.score) || 0));
    const against = all.filter((s) => s.polarity === 'against').sort((a, b) => (num(b.score) || 0) - (num(a.score) || 0));
    const one = (s, cls) => `<div class="sig ${num(s.score) > 0 ? '' : 'off'}" id="ev-${Number(s.evidence_id) || ''}">
        <div class="sig-top"><div class="sig-name">${esc(sigName(s.name))}<span class="label">${esc(FAMILY[s.family] || s.family || '')}</span></div>
        <div class="score ${cls}"><span class="num">${fix2(s.score)}</span><span class="bar"><i style="width:${Math.max(0, Math.min(1, num(s.score) || 0)) * 100}%"></i></span></div></div>
        <p>${esc(s.summary || '')}</p>${receipt(byId.get(s.evidence_id))}</div>`;
    const active = forCo.filter((s) => num(s.score) > 0);
    const quiet = forCo.filter((s) => !(num(s.score) > 0));
    return `<section class="card" aria-labelledby="h-sig">
      <div class="card-head"><h2 id="h-sig">Evidence</h2><span class="label">${plural(all.length, 'check')}</span></div>
      <div class="label group-label">Points to coordination</div>
      ${active.length ? active.map((s) => one(s, 's-coordinated')).join('') : '<p class="muted">No coordination signal fired.</p>'}
      ${quiet.length ? `<details class="fold" style="margin-top:12px"><summary>${plural(quiet.length, 'check')} found nothing</summary>${quiet.map((s) => one(s, '')).join('')}</details>` : ''}
      ${against.length ? `<div class="label group-label">Points to an organic crowd</div>${against.map((s) => one(s, 's-likely_organic')).join('')}` : ''}
    </section>`;
  }

  function timingCard(c, handles) {
    const sig = c.signals || {};
    const nd = sig.null_distribution;
    const tl = Array.isArray(sig.timeline) ? sig.timeline : [];
    const parts = [];
    if (nd && Array.isArray(nd.counts) && Array.isArray(nd.bin_edges) && nd.counts.length) {
      const W = 640, H = 150, P = 22, max = Math.max(...nd.counts, 1);
      const lo = nd.bin_edges[0], hi = nd.bin_edges[nd.bin_edges.length - 1];
      const x = (v) => P + ((v - lo) / (hi - lo || 1)) * (W - 2 * P);
      const bw = (W - 2 * P) / nd.counts.length;
      const bars = nd.counts.map((n, i) => `<rect x="${(P + i * bw + 1).toFixed(1)}" y="${(H - 24 - (n / max) * (H - 44)).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${((n / max) * (H - 44)).toFixed(1)}" fill="#55524d" rx="1.5"/>`).join('');
      const ox = x(Math.min(hi, Math.max(lo, num(nd.observed) || 0)));
      const worlds = nd.worlds || nd.counts.reduce((a, b) => a + b, 0);
      const k = nd.worlds_at_least_observed;
      parts.push(`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram of synchrony in ${worlds} shuffled worlds, with the real value marked at ${fix2(nd.observed)}">
          ${bars}
          <line x1="${P}" x2="${W - P}" y1="${H - 24}" y2="${H - 24}" stroke="rgba(255,255,255,.16)"/>
          <line x1="${ox}" x2="${ox}" y1="12" y2="${H - 24}" stroke="var(--shill)" stroke-width="2"/>
          <text x="${Math.min(ox + 6, W - 120)}" y="22" style="fill:var(--text)">real accounts ${fix2(nd.observed)}</text>
          <text x="${P}" y="${H - 6}">${fix2(lo)}</text><text x="${W - P}" y="${H - 6}" text-anchor="end">${fix2(hi)}</text>
          <text x="${W / 2}" y="${H - 6}" text-anchor="middle">share of actions in the same burst</text>
        </svg>
        <p class="chart-caption">We shuffled each account’s timing ${worlds.toLocaleString()} times. ${k != null ? `<strong>${k.toLocaleString()} of ${worlds.toLocaleString()}</strong> shuffled worlds were as synchronised as the real accounts` : 'The red line marks the real accounts'}${sig.p_value != null || c.p_value != null ? ` (p = ${pval(c.p_value ?? sig.p_value)}).` : '.'}</p>`);
    }
    if (tl.length > 1) {
      const nodes = (sig.member_graph && sig.member_graph.nodes) || [];
      const rows = [...new Set(tl.map((p) => p.n))];
      const keys = [...new Set(tl.map((p) => p.key))];
      const palette = ['#e2533c', '#e4b36a', '#7aa2f0', '#5fc9a8', '#c792ea', '#f2efe9'];
      const t0 = Math.min(...tl.map((p) => p.t)), t1 = Math.max(...tl.map((p) => p.t));
      const W = 640, rowH = Math.max(6, Math.min(14, 160 / rows.length)), H = rows.length * rowH + 30, P = 22;
      const x = (t) => P + ((t - t0) / (t1 - t0 || 1)) * (W - 2 * P);
      const dots = tl.map((p) => `<circle cx="${x(p.t).toFixed(1)}" cy="${(8 + rows.indexOf(p.n) * rowH + rowH / 2).toFixed(1)}" r="${Math.min(4, rowH / 2.4).toFixed(1)}" fill="${keys.indexOf(p.key) < palette.length ? palette[keys.indexOf(p.key)] : '#8f8b84'}"><title>${esc(handles.get(nodes[p.n]) || 'account')} · ${esc(tf.format(new Date(p.t * 1000)))}</title></circle>`).join('');
      const grid = rows.map((_, i) => `<line x1="${P}" x2="${W - P}" y1="${(8 + i * rowH + rowH / 2).toFixed(1)}" y2="${(8 + i * rowH + rowH / 2).toFixed(1)}" stroke="rgba(255,255,255,.05)"/>`).join('');
      const fmt = (t) => tf.format(new Date(t * 1000));
      parts.push(`<div class="label group-label" style="margin-top:24px">Who acted when</div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tl.length} actions by ${rows.length} accounts between ${fmt(t0)} and ${fmt(t1)}">${grid}${dots}
          <text x="${P}" y="${H - 6}">${fmt(t0)}</text><text x="${W - P}" y="${H - 6}" text-anchor="end">${fmt(t1)}</text></svg>
        <div class="legend"><span>One row per account · one colour per shared item${keys.length > palette.length ? ` (first ${palette.length} of ${keys.length})` : ''}</span></div>`);
    }
    if (!parts.length) return '';
    return `<section class="card" aria-labelledby="h-time"><div class="card-head"><h2 id="h-time">Timing test</h2><span class="label">null model</span></div>${parts.join('')}</section>`;
  }

  function opinionCard(c, byId) {
    const v = c.analyst;
    const brief = c.verdict;
    if (!v && !brief) return `<section class="card" aria-labelledby="h-op"><div class="card-head"><h2 id="h-op">Second opinion</h2><span class="label">Gemini</span></div><p class="muted">Gemini hasn’t reviewed this cluster. Reviews go to the strongest clusters first, within an hourly budget.</p></section>`;
    const a = v || brief;
    const call = a.llm_assessment || a.status;
    const agreesNow = call === c.status;
    const stale = v && v.cluster_updated_at && c.updated_at && new Date(v.cluster_updated_at) < new Date(c.updated_at) - 1000;
    const thenStatus = v && v.detector_status;
    const cited = (v && Array.isArray(v.evidence) ? v.evidence : []).filter((x) => x.why || x.summary);
    const list = (title, xs) => (xs && xs.length ? `<div><h3 class="label">${title}</h3><ul>${xs.join('')}</ul></div>` : '');
    const citedItems = cited.map((x) => `<li>${esc(x.why || x.summary)}${x.evidence_id && byId.has(x.evidence_id) && document ? ` <a href="#ev-${Number(x.evidence_id)}" data-jump="${Number(x.evidence_id)}">#${Number(x.evidence_id)}</a>` : ''}</li>`);
    const tools = Array.isArray(v && v.tool_calls) ? v.tool_calls.length : (a.tool_calls || 0);
    return `<section class="card opinion-card" aria-labelledby="h-op">
      <div class="card-head"><h2 id="h-op">Second opinion</h2><span class="label">Gemini</span></div>
      <p class="call-line">${pill(call)}<span class="lede">${agreesNow ? 'Agrees with the detector' : 'Reads it differently from the detector'}${a.confidence != null ? ` · ${pct(a.confidence)} sure` : ''}</span></p>
      <p class="muted" style="font-size:13px;margin-top:6px">Gemini explains the call; it can’t change it.</p>
      ${stale ? `<p class="notice" style="margin-top:12px"><strong>Written on an earlier state of this cluster.</strong> ${thenStatus && thenStatus !== c.status ? `The detector said ${esc((STATUS[thenStatus] || {}).word || thenStatus)} then; it has updated since.` : 'New activity arrived after this review.'}</p>` : ''}
      ${a.summary ? `<p style="margin-top:14px">${esc(a.summary)}</p>` : ''}
      ${!agreesNow && !stale && a.disagreement_reason ? `<p class="notice" style="margin-top:12px"><strong>Why it disagrees:</strong> ${esc(a.disagreement_reason)}</p>` : ''}
      <div class="reasons">
        ${list('What it cites', citedItems)}
        ${list('What points the other way', (v && v.counter_evidence || []).map((x) => `<li>${esc(x)}</li>`))}
        ${list('What would change its mind', (v && v.would_change_verdict || []).map((x) => `<li>${esc(x)}</li>`))}
      </div>
      <div class="foot-meta">${a.model ? `<span>${esc(a.model)}</span>` : ''}${tools ? `<span>${plural(tools, 'tool call')}</span>` : ''}${v && v.cost_usd != null ? `<span>$${Number(v.cost_usd).toFixed(3)}</span>` : ''}${a.created_at ? `<span>${esc(when(a.created_at))}</span>` : ''}</div>
    </section>`;
  }

  function mediaCard(c, evidence) {
    const media = evidence.filter((e) => e.kind === 'media');
    const seen = new Set(media.map((e) => (e.detail || {}).media_hash));
    const unread = [...new Set((c.posts || []).flatMap((p) => p.media_hashes || []))].filter((h) => !seen.has(h)).length;
    if (!media.length && !unread) return '';
    const items = media.map((e) => {
      const d = e.detail || {};
      if (d.status === 'failed') return `<div class="item"><span class="label">Couldn’t read this image</span><p>${esc(d.error || e.summary || 'Image analysis failed.')}</p></div>`;
      if (d.type === 'ocr_template') return `<div class="item"><span class="label">Same text template in different images</span><p>${esc(e.summary || '')}</p>${(d.varying_tokens || []).length ? `<p class="muted">Words that change: ${esc(d.varying_tokens.join(', '))}</p>` : ''}</div>`;
      const ocr = Array.isArray(d.extracted_text) ? d.extracted_text.join(' / ') : '';
      return `<div class="item">
        ${d.media_url ? ext(d.media_url, `<img class="thumb" src="${esc(d.media_url)}" alt="${esc(d.description || 'Image posted by the cluster')}" loading="lazy" referrerpolicy="no-referrer">`) : ''}
        <p>${esc(d.description || e.summary || '')}</p>
        ${ocr ? `<p class="muted">Text in image: “${esc(ocr)}”</p>` : ''}
        <span class="muted" style="font-size:13px">Same file from ${plural(Number(d.n_accounts || 0), 'account')}${d.n_posts ? ` in ${plural(Number(d.n_posts), 'post')}` : ''}${e.source_url ? ` · ${ext(e.source_url, 'first post ↗', 'out')}` : ''}</span>
      </div>`;
    });
    return `<section class="card" aria-labelledby="h-media"><div class="card-head"><h2 id="h-media">Images</h2><span class="label">Nemotron Super VL</span></div>
      ${items.join('')}${unread ? `<p class="muted" style="font-size:13px;margin-top:${media.length ? 12 : 0}px">${plural(unread, 'image')} in these posts ${unread === 1 ? 'hasn’t' : 'haven’t'} been read by the model.</p>` : ''}</section>`;
  }

  function sourcesCard(evidence) {
    const src = evidence.filter((e) => e.kind === 'source');
    if (!src.length) return '';
    const items = src.map((e) => {
      const d = e.detail || {};
      const hits = Array.isArray(d.hits) ? d.hits.slice(0, 3) : [];
      const by = d.requested_by && String(d.requested_by).startsWith('gemini') ? `<p class="muted" style="font-size:13px">Asked for by Gemini${d.why ? `: ${esc(d.why)}` : ''}</p>` : '';
      const url = e.source_url || d.final_url || d.url;
      return `<div class="item"><p style="color:var(--text)">${esc(e.summary || d.title || 'Web check')}</p>${by}
        ${hits.length ? `<div class="hits">${hits.map((h) => `<a href="${esc(h.url)}" target="_blank" rel="noreferrer noopener"><span>${esc(h.domain || host(h.url))}</span>${esc(h.title || h.url)}</a>`).join('')}</div>` : ''}
        ${url ? ext(url, `${esc(host(url))} ↗`, 'out') : '<span class="muted">No source URL recorded.</span>'}</div>`;
    });
    return `<section class="card" aria-labelledby="h-src" data-fold><div class="card-head"><h2 id="h-src">On the web</h2><span class="label">Oxylabs, live</span></div>
      ${items.map((x, i) => (i < 4 ? x : x.replace('<div class="item">', '<div class="item" hidden>'))).join('')}
      ${items.length > 4 ? `<button class="linkish" data-showall style="margin-top:8px">Show all ${items.length}</button>` : ''}</section>`;
  }

  function accountsCard(c) {
    const ms = c.members || [];
    if (!ms.length) return '';
    const age = (d) => { if (!d) return '–'; const days = Math.floor((Date.now() - new Date(d)) / 864e5); return days > 730 ? `${Math.floor(days / 365)} y` : `${days} d`; };
    const rows = ms.map((m, i) => `<tr${i >= 10 ? ' hidden' : ''}><td class="handle">${ext(m.profile_url, esc(m.handle || m.did))}</td><td class="r num">${age(m.account_created_at)}</td><td class="r num">${m.followers == null ? '–' : Number(m.followers).toLocaleString()}</td></tr>`).join('');
    return `<section class="card" aria-labelledby="h-acc" data-fold><div class="card-head"><h2 id="h-acc">Accounts</h2><span class="label">${ms.length}</span></div>
      <table><thead><tr><th>Handle</th><th class="r">Age</th><th class="r">Followers</th></tr></thead><tbody>${rows}</tbody></table>
      ${ms.length > 10 ? `<button class="linkish" data-showall style="margin-top:12px">Show all ${ms.length}</button>` : ''}</section>`;
  }

  function postsCard(c, handles) {
    const ps = c.posts || [];
    if (!ps.length) return '';
    const items = ps.map((p, i) => `<article class="post"${i >= 6 ? ' hidden' : ''}>
        <div class="post-meta"><span>${esc(handles.get(p.did) || p.did)}</span><span>${p.url ? ext(p.url, `${esc(when(p.created_at || p.seen_at))} ↗`) : esc(when(p.created_at || p.seen_at))}</span></div>
        <p>${esc(p.text || '(no text)')}</p>
        ${(p.embed_urls || []).length ? `<div class="links" style="margin-top:8px">${p.embed_urls.slice(0, 3).map((u) => ext(u, `${esc(host(u))} ↗`)).join('')}</div>` : ''}
      </article>`).join('');
    return `<section class="card" aria-labelledby="h-posts" data-fold><div class="card-head"><h2 id="h-posts">Posts</h2><span class="label">${ps.length} captured</span></div>${items}
      ${ps.length > 6 ? `<button class="linkish" data-showall style="margin-top:12px">Show all ${ps.length}</button>` : ''}</section>`;
  }

  // ---------- accuracy
  const DATASETS = {
    organic_live: { order: 1, q: 'Does it flag real organic crowds?', what: 'Real bursts of organic activity in recorded windows, picked by a fixed rule that never looks at the detector.', metric: 'fpr', good: 'low', unit: 'called coordinated', items: 'organic bursts' },
    organic_synth: { order: 2, q: 'Does it flag look-alike organic crowds?', what: 'Synthetic viral, news-link, live-event and fandom bursts injected into real traffic.', metric: 'fpr', good: 'low', unit: 'called coordinated', items: 'organic bursts' },
    synthetic_campaigns: { order: 3, q: 'Does it catch planted campaigns?', what: 'Synthetic campaigns of three difficulty levels injected into real traffic.', metric: 'recall', good: 'high', unit: 'caught', items: 'campaigns' },
    live_hand_labels: { order: 4, q: 'Do humans agree when it says coordinated?', what: 'Live clusters labelled blind by two people.', metric: 'precision', good: 'high', unit: 'confirmed by humans', items: 'labelled clusters' },
    bluesky_takedowns: { order: 5, q: 'Does Bluesky later act on the accounts it flags?', what: 'Share of flagged accounts Bluesky takes down or suspends afterwards, compared with random active accounts.', metric: null, good: 'high', items: 'accounts' },
    calibration: { order: 6, q: 'Is its confidence calibrated?', what: 'Reliability of the score and the verdict confidence against labelled outcomes.', metric: null, good: 'high', items: 'cases' },
  };
  const LEVELS = { L1: 'Copy-paste text, brand-new templated accounts, burst under a minute', L2: 'Light paraphrase, weeks-old accounts, minutes of jitter', L3: 'Heavy paraphrase, aged accounts with followers, slow drip' };
  const METRIC_WORD = { fpr: 'false-positive rate', recall: 'recall', precision: 'precision', f1: 'F1' };

  function ciBar(ci, value, cls) {
    if (!Array.isArray(ci) || ci.length !== 2) return '';
    const [lo, hi] = ci.map(Number);
    return `<div class="${cls}"><div class="ci-track" aria-hidden="true"><i style="left:${lo * 100}%;width:${Math.max(0, hi - lo) * 100}%"></i><em style="left:calc(${(num(value) || 0) * 100}% - 1px)"></em></div><div class="ci-scale"><span>0%</span><span>50%</span><span>100%</span></div></div>`;
  }
  function accCard(ds, runs) {
    const meta = DATASETS[ds] || { q: ds.replace(/_/g, ' '), what: '', metric: null, items: 'items' };
    const main = runs.find((r) => r.split === 'heldout') || runs[0];
    const other = runs.filter((r) => r !== main);
    const d = main.details || {};
    const metric = meta.metric || ['fpr', 'recall', 'precision', 'f1'].find((m) => main[m] != null);
    let big = '';
    if (metric && main[metric] != null) {
      const n = num(main.n);
      const k = n != null ? Math.round(num(main[metric]) * n) : null;
      const ci = d[`${metric}_ci95`];
      big = `<div class="big"><b>${pct(main[metric], 1)}</b><span>${METRIC_WORD[metric]}</span></div>
        <div class="ci">${k != null && meta.unit ? `${k} of ${n.toLocaleString()} ${meta.items} ${meta.unit}` : n != null ? `n = ${n.toLocaleString()}` : ''}${Array.isArray(ci) ? ` · 95% interval ${pct(ci[0], 1)} – ${pct(ci[1], 1)}` : ''}</div>
        ${ciBar(ci, main[metric], 'neutral')}`;
    } else if (ds === 'bluesky_takedowns' && d.headline) {
      const h = d.headline;
      big = `<div class="big"><b>${pct(h.coordinated_moderated_rate, 1)}</b><span>of flagged accounts taken down</span></div><div class="ci">vs. ${pct(h.random_active_moderated_rate, 1)} of random active accounts${d.horizon_h ? ` · within ${Number(d.horizon_h)} h` : ''}</div>`;
    } else {
      big = `<div class="big"><b>${main.n == null ? '–' : Number(main.n).toLocaleString()}</b><span>${esc(meta.items)}</span></div>`;
    }
    const extra = [];
    if (d.clustered != null && main.n != null) extra.push(`<p class="ci" style="margin-top:12px">${Number(d.clustered)} of ${Number(main.n)} were grouped into a cluster at all; the rest were never surfaced.</p>`);
    if (d.per_level) {
      extra.push(`<div class="levels">${Object.entries(d.per_level).map(([lv, x]) => {
        const r = x.recall || {};
        return `<div class="level"><span class="mono">${esc(lv)}</span><span>${esc(LEVELS[lv] || '')}<small>${r.k ?? '–'} of ${r.n ?? '–'} caught</small></span><span class="score neutral"><span class="num">${pct(r.rate)}</span><span class="bar"><i style="width:${(num(r.rate) || 0) * 100}%"></i></span></span></div>`;
      }).join('')}</div>`);
    }
    const others = other.map((r) => `${esc(r.split)} split: ${metric && r[metric] != null ? pct(r[metric], 1) : '–'}${r.n != null ? ` (n = ${Number(r.n).toLocaleString()})` : ''}`).join(' · ');
    return `<section class="card acc">
      <div class="card-head" style="margin-bottom:0"><h2 class="q">${esc(meta.q)}</h2><span class="split ${main.split === 'heldout' ? '' : 'dev'}">${main.split === 'heldout' ? 'held-out' : esc(main.split)}</span></div>
      <p class="what">${esc(meta.what)}</p>
      ${big}${extra.join('')}
      <div class="foot-meta">${d.detector_version ? `<span>detector ${esc(d.detector_version)}</span>` : ''}${d.eval_commit ? `<span>eval ${esc(d.eval_commit)}</span>` : ''}<span>run ${esc(when(main.created_at))}</span>${others ? `<span>${others}</span>` : ''}</div>
    </section>`;
  }
  function renderAccuracy() {
    const runs = state.metrics.filter((m) => m && m.dataset);
    const groups = new Map();
    runs.forEach((r) => { if (!groups.has(r.dataset)) groups.set(r.dataset, []); groups.get(r.dataset).push(r); });
    const ordered = [...groups.keys()].sort((a, b) => ((DATASETS[a] || {}).order || 99) - ((DATASETS[b] || {}).order || 99));
    let body;
    if (!state.loaded) body = '<div class="card state">Loading evaluation runs…</div>';
    else if (state.metricsError) body = `<div class="card state" role="alert"><h2>Evaluation results are unavailable</h2><p>${esc(state.metricsError)}</p></div>`;
    else if (!ordered.length) body = `<div class="card state"><h2>No evaluation runs published to this deployment yet</h2><p>Results appear here as soon as the eval harness writes them. We don’t show numbers we haven’t measured.</p></div>`;
    else body = `<div class="acc-grid">${ordered.map((ds) => accCard(ds, groups.get(ds))).join('')}</div>`;
    app.innerHTML = `
      <section class="page-head"><div><h1>How often is it wrong?</h1><p>Every number here is read from the evaluation runs in the database, measured on data the detector was never tuned on. None of it is typed in by hand.</p></div></section>
      <div class="acc-intro">
        <div><strong>False positives first</strong>Calling a real crowd “coordinated” is the costly mistake, so those tests come first.</div>
        <div><strong>Held-out data</strong>Odd UTC hours are held out: thresholds are never tuned on them.</div>
        <div><strong>Intervals, not just points</strong>Small samples get wide 95% intervals. Read the range, not only the number.</div>
      </div>
      ${body}`;
  }

  // ---------- method
  function renderMethod() {
    app.innerHTML = `<div class="prose">
      <section class="page-head" style="margin-bottom:8px"><div><h1>How a call is made</h1><p>Noise Radar judges behaviour, not opinions. It never decides whether a post is true, popular or acceptable; only whether the accounts behind it acted together.</p></div></section>
      <div class="steps">
        <div class="step"><span class="label">01 · Group</span><h3>Find accounts acting together</h3><p>The live Bluesky stream is cut into time windows. Accounts that share the same links, text, images or engagement are grouped into a cluster.</p></div>
        <div class="step"><span class="label">02 · Test</span><h3>Check four families of signals</h3><p>Content, timing, network and identity. Timing is tested against the same accounts with their activity shuffled in time.</p></div>
        <div class="step"><span class="label">03 · Decide</span><h3>Apply fixed rules</h3><p>A written rule makes the call. Organic guards, such as established accounts or a wider crowd, pull it back.</p></div>
        <div class="step"><span class="label">04 · Explain</span><h3>Attach receipts</h3><p>Gemini writes a second opinion citing the evidence, Nemotron reads the images and Oxylabs checks the web live.</p></div>
      </div>
      <h2>Three possible calls</h2>
      <div class="outcomes">
        <div class="outcome">${pill('coordinated')}<p>Several independent signal families fired, the timing beats chance, and no organic guard holds.</p></div>
        <div class="outcome">${pill('insufficient')}<p>Something looked unusual, but not enough for a call. Abstaining is a result, not a failure: it keeps false accusations down.</p></div>
        <div class="outcome">${pill('likely_organic')}<p>The organic guards hold: established accounts, or a crowd much wider than the cluster.</p></div>
      </div>
      <h2>Who decides what</h2>
      <ul>
        <li><strong>The detector decides.</strong> Its rules are code; the exact rule and the measured values are on every cluster page.</li>
        <li><strong>Gemini explains.</strong> It can disagree, and when it does, the page says so, but it never changes the call.</li>
        <li><strong>Nemotron Super VL reads images:</strong> what they show, the text inside them, and whether different images share one template.</li>
        <li><strong>Oxylabs fetches the web live</strong> to find where a link or text appeared before. Every result keeps its source URL.</li>
      </ul>
      <h2>Limits</h2>
      <ul>
        <li>Big organic moments such as breaking news, sport and fandom can look coordinated. The guards and the held-out false-positive tests exist for this.</li>
        <li>Slow, careful campaigns run from aged accounts are hard to see in one window. The <a href="#/accuracy">Accuracy</a> page shows how many we miss.</li>
        <li>A cluster is evidence of coordinated behaviour, not proof of who is behind it or why.</li>
      </ul>
      <h2>Data</h2>
      <p>Read-only: Noise Radar reads the public Bluesky stream and never posts, follows or reports. Posts and profiles are shown only to explain a cluster.</p>
    </div>`;
  }

  // ---------- boot
  app.addEventListener('click', (e) => {
    const j = e.target.closest('[data-jump]');
    if (!j) return;
    e.preventDefault();
    const el = document.getElementById(`ev-${j.dataset.jump}`);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); const d = el.querySelector('details'); if (d) d.open = true; }
  });
  route();
  load().then(route);
  setInterval(async () => {
    await load();
    const onMonitor = !location.hash.replace(/^#\/?/, '') ;
    const typing = document.activeElement && document.activeElement.matches('input, textarea');
    if (onMonitor && !typing) {
      const y = window.scrollY; const focusId = document.activeElement && document.activeElement.getAttribute('href');
      renderMonitor(); window.scrollTo(0, y);
      if (focusId) { const f = app.querySelector(`[href="${focusId}"]`); if (f) f.focus({ preventScroll: true }); }
    }
  }, 30000);
  setInterval(renderLive, 10000);
})();
</script>
</body>
</html>
